<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEELESS · RP character</title>
<script type="importmap">{ "imports": { "three": "/assets/three/three.module.js" } }</script>
<style>
  :root { color-scheme: dark; --g: #15d16a; --g2: #45e486; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #030806; color: #cfe3d8; font: 13px "JetBrains Mono", ui-monospace, monospace; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .wrap { width: min(520px, 100%); display: grid; gap: 12px; }
  h1 { margin: 0; font: 800 15px "JetBrains Mono", monospace; letter-spacing: .16em; color: var(--g2); }
  small { opacity: .65; line-height: 1.5; }
  .stage { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid #15d16a44; background: #000; aspect-ratio: 4 / 5; touch-action: none; cursor: grab; box-shadow: 0 0 40px -14px #15d16a; }
  .stage:active { cursor: grabbing; } canvas { display: block; width: 100%; height: 100%; }
  .tag { position: absolute; left: 12px; top: 10px; font-size: 10px; letter-spacing: .18em; color: var(--g2); text-transform: uppercase; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .lab { font-size: 10px; letter-spacing: .16em; opacity: .7; width: 64px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ffffff22; cursor: pointer; padding: 0; transition: transform .15s, border-color .15s; }
  .sw:hover, .sw:focus-visible { transform: scale(1.12); border-color: var(--g2); outline: none; } .sw.on { border-color: #fff; box-shadow: 0 0 10px var(--g); }
  button.b { font: 700 12px "JetBrains Mono", monospace; padding: 8px 14px; border-radius: 10px; border: 1px solid #15d16a66; background: #07130d; color: var(--g2); cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; }
  button.b:hover, button.b:focus-visible { box-shadow: 0 0 14px #15d16a66; transform: translateY(-1px); outline: none; } button.b:active { transform: translateY(1px); }
  #sexseg button.on { background: linear-gradient(180deg, #15d16a, #0b8f47); color: #02150b; border-color: #45e486; }
  button.b.go { background: linear-gradient(180deg, #15d16a, #0b8f47); color: #02150b; border-color: #45e486; } button.b:disabled { opacity: .5; cursor: wait; }
  @media (prefers-reduced-motion: reduce) { .sw, button.b { transition: none; } }
</style></head>
<body>
<div class="wrap">
  <h1>⚛ FEELESS · BEGINNER AVATARS</h1>
  <div class="stage" id="stage"><span class="tag">drag to turn · original model</span></div>
  <div class="row"><span class="lab">BASE</span><span id="sexseg" class="row"><button class="b on" data-sex="m" type="button">♂ Male</button><button class="b" data-sex="f" type="button">♀ Female</button></span></div>
  <div class="row"><span class="lab">TOP</span><span id="sw-top" class="row"></span></div>
  <div class="row"><span class="lab">PANTS</span><span id="sw-pants" class="row"></span></div>
  <div class="row"><span class="lab">HAIR</span><span id="sw-hair" class="row"></span></div>
  <div class="row"><span class="lab">SKIN</span><span id="sw-skin" class="row"></span></div>
  <div class="row"><button class="b" id="spin">⏸ Spin</button><button class="b" id="png">⬇ PNG</button><button class="b go" id="gif">⬇ GIF (3s loop)</button><small id="msg"></small></div>
  <small>Original plain male and female starter bases, built in code (no GTA / Rockstar / Sony assets), so the model is yours to use. Runs in any modern browser, nothing to install.</small>
</div>
<script type="module">
import * as THREE from 'three';

const W = 480, H = 600;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x040a07); scene.fog = new THREE.Fog(0x040a07, 7, 14);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 50); cam.position.set(0, 1.45, 7.8); cam.lookAt(0, 1.05, 0);

// lights: soft sky, warm key, royal-green rim from behind, pink fill
scene.add(new THREE.HemisphereLight(0xdfeee6, 0x1a2a22, 1.5));
const key = new THREE.DirectionalLight(0xfff3e4, 2.6); key.position.set(2.5, 4.5, 5); scene.add(key);
const rim = new THREE.PointLight(0x15d16a, 14, 12); rim.position.set(-2.5, 2.2, -2.6); scene.add(rim);
const fill = new THREE.PointLight(0xff5fa8, 6, 10); fill.position.set(2.6, 1.0, 2.2); scene.add(fill);

// floor: dark disc + neon ring + a few city blocks far behind
const floor = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 0.08, 48), new THREE.MeshStandardMaterial({ color: 0x0b1712, roughness: 0.35, metalness: 0.4 }));
floor.position.y = -0.04; scene.add(floor);
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.05, 0.025, 8, 96), new THREE.MeshBasicMaterial({ color: 0x45e486 })); ring.rotation.x = Math.PI / 2; scene.add(ring);
const city = new THREE.Group(); scene.add(city);
for (let i = 0; i < 16; i++) {
  const a = (i / 16) * Math.PI * 2, r = 6.5 + (i % 3) * 0.9, h = 1.6 + ((i * 7) % 5) * 0.8;
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.2, h, 1.2), new THREE.MeshStandardMaterial({ color: 0x0c1a14, roughness: 0.8 }));
  b.position.set(Math.sin(a) * r, h / 2 - 0.1, -Math.abs(Math.cos(a)) * r - 2); city.add(b);
  for (let k = 0; k < 4; k++) { const w = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.12), new THREE.MeshBasicMaterial({ color: (i + k) % 3 ? 0x45e486 : 0xffc857 }));
    w.position.set(b.position.x + (k % 2 ? 0.25 : -0.25), 0.4 + k * (h / 4.5), b.position.z + 0.61); city.add(w); }
}

// ---- original beginner avatars: a plain male and female base (smooth capsules + spheres, starter tee / jeans / trainers) ----
const phys = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.6, ...o });
const mats = {
  skin: phys(0xe0ac86, { roughness: 0.55, sheen: 0.4, sheenColor: new THREE.Color(0xffb08a), clearcoat: 0.08 }),
  top: phys(0x15d16a, { roughness: 0.92, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xa6f0c8) }),
  jeans: phys(0x27406e, { roughness: 0.95, sheen: 0.6, sheenColor: new THREE.Color(0x6a8ac0) }),
  shoe: phys(0xf2f4f3, { roughness: 0.4, clearcoat: 0.3 }),
  sole: phys(0x9aa3a0, { roughness: 0.6 }),
  hair: phys(0x3b2416, { roughness: 0.75, sheen: 0.6, sheenColor: new THREE.Color(0xb98a60) }),
  eye: phys(0xf7f7f4, { roughness: 0.2, clearcoat: 1 }),
  iris: phys(0x2a1c12, { roughness: 0.2, clearcoat: 1 }),
  mouth: phys(0x9c4a4a, { roughness: 0.5 }),
};
const add = (parent, geo, mat, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); parent.add(m); return m; };
const cap = (r, len) => new THREE.CapsuleGeometry(r, len, 10, 28);
const ball = (r, w = 32, h = 24) => new THREE.SphereGeometry(r, w, h);

let fig = null;
function build(sex) {
  const f = sex === 'f';
  if (fig) { scene.remove(fig.rig); }
  const rig = new THREE.Group(); scene.add(rig); const body = new THREE.Group(); rig.add(body);
  const hipX = f ? 0.135 : 0.15, legR = f ? 0.1 : 0.115, shX = f ? 0.27 : 0.315;
  // legs + trainers
  const legs = [];
  for (const s of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(s * hipX, 1.12, 0); body.add(leg);
    add(leg, cap(legR, 0.74), mats.jeans, 0, -0.55, 0, 1.06, 1, 1);
    add(leg, new THREE.TorusGeometry(legR - 0.005, 0.028, 12, 32), mats.jeans, 0, -1.0, 0).rotation.x = Math.PI / 2;
    const shoe = add(leg, cap(0.082, 0.17), mats.shoe, 0, -1.09, 0.07, 1.12, 0.85, 1); shoe.rotation.x = Math.PI / 2;
    const sole = add(leg, cap(0.087, 0.17), mats.sole, 0, -1.145, 0.07, 1.16, 0.28, 1); sole.rotation.x = Math.PI / 2;
    legs.push(leg);
  }
  // torso: tee over a smooth body; hips in jeans; chest + longer neck for the female base
  const torso = new THREE.Group(); torso.position.y = 1.13; body.add(torso);
  add(torso, cap(f ? 0.205 : 0.235, 0.22), mats.top, 0, 0.37, 0, f ? 1.08 : 1.16, 1, f ? 0.76 : 0.8);
  add(torso, ball(f ? 0.185 : 0.2, 28, 20), mats.jeans, 0, -0.03, 0, f ? 1.3 : 1.1, 0.78, f ? 0.95 : 0.85);                // hips
  add(torso, new THREE.TorusGeometry(f ? 0.205 : 0.235, 0.025, 12, 36), mats.top, 0, 0.06, 0, f ? 1.08 : 1.16, f ? 0.78 : 0.8, 1).rotation.x = Math.PI / 2;
  if (f) for (const s of [-1, 1]) add(torso, ball(0.085, 22, 16), mats.top, s * 0.082, 0.52, 0.12, 1, 0.95, 0.9);        // chest
  add(torso, cap(f ? 0.058 : 0.072, 0.1), mats.skin, 0, f ? 0.79 : 0.77, 0);                                              // neck
  add(torso, new THREE.TorusGeometry(f ? 0.085 : 0.105, 0.02, 12, 28), mats.top, 0, f ? 0.7 : 0.69, 0.005, 1, 1, 0.9).rotation.x = Math.PI / 2 - 0.3;   // collar
  // head + face
  const head = new THREE.Group(); head.position.set(0, f ? 1.03 : 1.04, 0); torso.add(head);
  const hs = f ? 0.235 : 0.25;
  add(head, ball(hs, 40, 28), mats.skin, 0, 0.01, 0, 0.9, 1.06, 0.96);
  add(head, ball(hs * 0.8, 32, 22), mats.skin, 0, -0.08, 0.035, f ? 0.85 : 0.97, 0.95, 0.92);                              // jaw (narrower for the female base)
  add(head, ball(0.03, 18, 14), mats.skin, 0, -0.03, hs - 0.012, 1, 1.15, 1.1);                                              // nose
  for (const s of [-1, 1]) {
    add(head, ball(0.04, 16, 12), mats.skin, s * (hs - 0.025), -0.01, 0, 0.55, 1.2, 0.8);                                    // ears
    add(head, ball(0.03, 20, 14), mats.eye, s * 0.075, 0.04, hs * 0.895, 1.15, 0.85, 0.5);                                     // eye white
    add(head, ball(0.016, 16, 12), mats.iris, s * 0.075, 0.04, hs * 0.945, 1, 1, 0.5);                                        // iris
    const br = add(head, new THREE.CapsuleGeometry(0.009, f ? 0.05 : 0.06, 4, 10), mats.hair, s * 0.078, 0.1, hs * 0.875); br.rotation.z = Math.PI / 2 - s * 0.12;   // brow
  }
  add(head, new THREE.CapsuleGeometry(0.008, f ? 0.045 : 0.05, 4, 10), mats.mouth, 0, -0.105, hs - 0.02).rotation.z = Math.PI / 2;   // mouth
  // hair
  add(head, new THREE.SphereGeometry(hs + 0.014, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.41), mats.hair, 0, 0.04, -0.015, 0.93, 1.05, 1.03);
  if (f) {
    add(head, ball(0.25, 28, 20), mats.hair, 0, -0.12, -0.1, 0.96, 1.25, 0.72);                                               // long back hair
    for (const s of [-1, 1]) add(head, cap(0.05, 0.22), mats.hair, s * 0.19, -0.1, 0.0, 1, 1, 1);                              // side locks
  } else add(head, ball(0.1, 20, 14), mats.hair, 0, 0.2, 0.15, 1.5, 0.5, 0.7);                                           // short fringe
  // arms: short sleeves, skin below, relaxed hands
  const arms = {};
  for (const s of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(s * shX, 0.6, 0); torso.add(arm);
    add(arm, ball(f ? 0.074 : 0.086, 24, 18), mats.top, 0, 0, 0);
    add(arm, cap(f ? 0.07 : 0.082, 0.08), mats.top, 0, -0.1, 0);
    add(arm, cap(f ? 0.058 : 0.068, 0.12), mats.skin, 0, -0.26, 0);
    const fore = new THREE.Group(); fore.position.set(0, -0.37, 0); arm.add(fore);
    add(fore, ball(f ? 0.058 : 0.068, 18, 14), mats.skin, 0, 0, 0);
    add(fore, cap(f ? 0.052 : 0.06, 0.2), mats.skin, 0, -0.17, 0);
    add(fore, ball(f ? 0.052 : 0.06, 20, 16), mats.skin, 0, -0.37, 0.005, 1, 1.2, 0.85);
    arm.rotation.z = s * 0.1; fore.rotation.x = -0.18;
    arms[s] = { arm, fore };
  }
  fig = { rig, torso, head, arms, legs };
  const t = document.querySelectorAll('#sexseg button'); t.forEach(b => b.classList.toggle('on', b.dataset.sex === sex));
}

// ---- designer: starter-kit pickers + male / female switch ----
const palette = (id, list, apply) => {
  const box = document.getElementById(id);
  list.forEach(([name, hex], i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (i === 0 ? ' on' : ''); b.style.background = '#' + hex.toString(16).padStart(6, '0'); b.title = name; b.setAttribute('aria-label', name);
    b.onclick = () => { box.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); b.classList.add('on'); apply(hex); }; box.appendChild(b); });
};
palette('sw-top', [['Green', 0x15d16a], ['White', 0xe9eeec], ['Black', 0x151819], ['Violet', 0x5a3aa8], ['Crimson', 0xb02a3c], ['Sky', 0x3a9ad6]], h => mats.top.color.setHex(h));
palette('sw-pants', [['Blue jeans', 0x27406e], ['Black', 0x15181a], ['Khaki', 0x9a8a5a], ['Grey', 0x59616a]], h => mats.jeans.color.setHex(h));
palette('sw-hair', [['Brown', 0x3b2416], ['Black', 0x0f0b09], ['Blonde', 0xd2b06a], ['Red', 0x9a3a1a], ['Pink', 0xd04b8a], ['Grey', 0x9aa0a4]], h => mats.hair.color.setHex(h));
palette('sw-skin', [['Tan', 0xe0ac86], ['Light', 0xf3d2b6], ['Medium', 0xb98156], ['Deep', 0x70472f], ['Olive', 0xc09a64]], h => mats.skin.color.setHex(h));
document.querySelectorAll('#sexseg button').forEach(b => { b.onclick = () => build(b.dataset.sex); });
build('m');

// ---- loop: breathing, a small head tilt and a turntable ----
let spin = true, yaw = -0.5, drag = null, t0 = performance.now();
const pose = t => {                       // t in seconds; everything repeats every 3s so the GIF loops cleanly
  const u = (t / 3) * Math.PI * 2, { torso, head, arms, legs } = fig;
  torso.position.y = 1.13 + Math.sin(u * 2) * 0.008;
  head.rotation.y = Math.sin(u) * 0.2; head.rotation.z = Math.sin(u * 2) * 0.03;
  arms[-1].arm.rotation.x = Math.sin(u) * 0.06; arms[1].arm.rotation.x = -Math.sin(u) * 0.06;
  legs[0].rotation.x = Math.sin(u) * 0.015; legs[1].rotation.x = -Math.sin(u) * 0.015;
  ring.material.color.setHSL(0.4, 0.75, 0.5 + Math.sin(u * 2) * 0.06);
};
const draw = () => renderer.render(scene, cam);
function frame(now) { const t = (now - t0) / 1000; pose(t % 3); if (spin && !drag) yaw += 0.012; fig.rig.rotation.y = yaw; draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, yaw }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (drag) yaw = drag.yaw + (e.clientX - drag.x) * 0.012; });
stage.addEventListener('pointerup', () => { drag = null; });
const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => { spin = !spin; spinBtn.textContent = spin ? '⏸ Spin' : '▶ Spin'; };
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { spin = false; spinBtn.textContent = '▶ Spin'; }

// ---- exports ----
const msg = document.getElementById('msg');
const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
document.getElementById('png').onclick = () => { draw(); renderer.domElement.toBlob(b => save(b, 'feeless-rp-character.png')); };
const gifBtn = document.getElementById('gif');
gifBtn.onclick = async () => {
  gifBtn.disabled = true; const wasSpin = spin; spin = false; msg.textContent = 'rendering…';
  try {
    const { GIFEncoder, quantize, applyPalette } = await import('/assets/gifenc.esm.js');
    const N = 48, gw = 360, gh = 450, off = document.createElement('canvas'); off.width = gw; off.height = gh; const og = off.getContext('2d', { willReadFrequently: true });
    const enc = GIFEncoder(), keepYaw = yaw;
    for (let i = 0; i < N; i++) {
      pose((i / N) * 3); fig.rig.rotation.y = -0.5 + (i / N) * Math.PI * 2; draw();
      og.drawImage(renderer.domElement, 0, 0, gw, gh); const { data } = og.getImageData(0, 0, gw, gh); const pal = quantize(data, 256);
      enc.writeFrame(applyPalette(data, pal), gw, gh, { palette: pal, delay: 62 }); msg.textContent = `frame ${i + 1}/${N}`; await new Promise(r => setTimeout(r, 0));
    }
    enc.finish(); yaw = keepYaw; const blob = new Blob([enc.bytes()], { type: 'image/gif' }); save(blob, 'feeless-rp-character.gif'); msg.textContent = `saved · ${(blob.size / 1024).toFixed(0)} KB`; window.__gifBytes = blob.size;
  } catch (e) { msg.textContent = 'GIF export failed: ' + (e?.message || e); } finally { spin = wasSpin; gifBtn.disabled = false; }
};
</script>
</body></html>
