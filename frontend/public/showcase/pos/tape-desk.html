<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tape · live desk</title>
<style>
:root{--bg:#07090d;--card:#0e131b;--line:#1c2532;--ink:#e6edf5;--mute:#7d8aa0;--up:#22c55e;--dn:#f43f5e;--acc:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#0f2a3a55,transparent),var(--bg);color:var(--ink);font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{display:grid;grid-template-columns:1fr 260px;grid-template-rows:auto 1fr auto;gap:10px;height:100vh;padding:12px}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.sym{font:700 18px system-ui}.px{font-size:22px;font-weight:700;transition:color .2s}.chg{padding:3px 8px;border-radius:6px;font-weight:700}
.kv{color:var(--mute)}.kv b{color:var(--ink);margin-left:6px}.tag{margin-left:auto;font-size:10px;letter-spacing:.1em;color:#fbbf24;border:1px solid #fbbf2455;padding:3px 7px;border-radius:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.panel h4{margin:0;padding:8px 12px;font:700 10px system-ui;letter-spacing:.12em;color:var(--mute);border-bottom:1px solid var(--line)}
canvas{display:block;width:100%;height:calc(100% - 31px)}
.book :is(#asks,#bids)>div{display:grid;grid-template-columns:1fr 1fr;padding:2px 12px;position:relative;font-variant-numeric:tabular-nums}.book :is(#asks,#bids)>div i{position:absolute;inset:0 0 0 auto;opacity:.16}.book .a i{background:var(--dn)}.book .b i{background:var(--up)}
.book .a span:first-child{color:var(--dn)}.book .b span:first-child{color:var(--up)}.book span:last-child{text-align:right}.book .mid{font-weight:700;font-size:15px;padding:6px 12px;border-block:1px solid var(--line)}
.flash{animation:fl .6s ease}@keyframes fl{0%{background:#38bdf833}to{background:transparent}}
.tape{grid-column:1/3;height:120px}.tape ul{list-style:none;margin:0;padding:0 12px;height:89px;overflow:hidden}.tape li{display:grid;grid-template-columns:70px 60px 1fr 1fr 90px;padding:3px 0;border-bottom:1px solid #ffffff08;animation:slide .35s ease}.tape li.w{background:linear-gradient(90deg,#fbbf2422,transparent)}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}}
.buy{color:var(--up)}.sell{color:var(--dn)}
@media(max-width:700px){.wrap{grid-template-columns:1fr;height:auto}.top,.tape{grid-column:1}.chart{height:300px}.book{height:330px}.tape li{grid-template-columns:56px 44px 1fr 1fr}.tape li span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="wrap">
 <div class="top"><span class="sym">SOL / USDC</span><span class="px" id="px">—</span><span class="chg" id="chg">—</span><span class="kv">24h vol<b id="vol">—</b></span><span class="kv">buys / sells<b id="bs">—</b></span><span class="tag">SAMPLE DATA · NOT LIVE</span></div>
 <div class="panel chart"><h4>1 MIN CANDLES</h4><canvas id="cv"></canvas></div>
 <div class="panel book" id="book"><h4>ORDER BOOK</h4><div id="asks"></div><div class="mid" id="mid">—</div><div id="bids"></div></div>
 <div class="panel tape"><h4>TRADE TAPE · WHALES MARKED</h4><ul id="tp"></ul></div>
</div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');let p=168.4,open=p,C=[],buys=0,sells=0,vol=2.41e8;
for(let i=0;i<60;i++){const o=p;for(let k=0;k<8;k++)p*=1+(Math.random()-.495)*.003;const h=Math.max(o,p)*(1+Math.random()*.002),l=Math.min(o,p)*(1-Math.random()*.002);C.push({o,c:p,h,l})}
open=C[0].o;
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0)}
function draw(){const w=cv.clientWidth,h=cv.clientHeight,lo=Math.min(...C.map(c=>c.l)),hi=Math.max(...C.map(c=>c.h)),Y=v=>22+(hi-v)/(hi-lo)*(h-40),bw=(w-50)/C.length;
cx.clearRect(0,0,w,h);cx.strokeStyle='#1c2532';cx.fillStyle='#7d8aa0';cx.font='10px ui-monospace';
for(let k=0;k<5;k++){const v=lo+(hi-lo)*k/4,y=Y(v);cx.beginPath();cx.moveTo(0,y);cx.lineTo(w-48,y);cx.stroke();cx.fillText(v.toFixed(2),w-44,y+3)}
C.forEach((c,i)=>{const x=i*bw+bw/2,up=c.c>=c.o;cx.strokeStyle=cx.fillStyle=up?'#22c55e':'#f43f5e';cx.beginPath();cx.moveTo(x,Y(c.h));cx.lineTo(x,Y(c.l));cx.stroke();const y1=Y(Math.max(c.o,c.c)),y2=Y(Math.min(c.o,c.c));cx.fillRect(x-bw*.35,y1,bw*.7,Math.max(1,y2-y1))});
const last=C[C.length-1],y=Y(last.c);cx.setLineDash([4,4]);cx.strokeStyle='#38bdf8';cx.beginPath();cx.moveTo(0,y);cx.lineTo(w-48,y);cx.stroke();cx.setLineDash([]);cx.fillStyle='#38bdf8';cx.fillRect(w-48,y-8,48,16);cx.fillStyle='#07090d';cx.fillText(last.c.toFixed(2),w-44,y+3)}
const $=id=>document.getElementById(id);
function book(){const m=C[C.length-1].c,row=(px,q,cl,mx)=>`<div class="${cl}"><i style="width:${q/mx*100}%"></i><span>${px.toFixed(2)}</span><span>${q.toFixed(1)}</span></div>`;const A=Array.from({length:8},(_,i)=>[m+.02*(8-i),5+Math.random()*90]),B=Array.from({length:8},(_,i)=>[m-.02*(i+1),5+Math.random()*90]),mx=Math.max(...A.concat(B).map(x=>x[1]));
$('asks').innerHTML=A.map(a=>row(a[0],a[1],'a',mx)).join('');$('bids').innerHTML=B.map(b=>row(b[0],b[1],'b',mx)).join('');$('mid').textContent=m.toFixed(2)+'  spread 0.02';$('mid').classList.remove('flash');void $('mid').offsetWidth;$('mid').classList.add('flash')}
function trade(){const last=C[C.length-1],side=Math.random()>.47?'buy':'sell',q=Math.random()<.07?400+Math.random()*1600:Math.random()*40,usd=q*last.c;side=='buy'?buys++:sells++;vol+=usd;
const li=document.createElement('li');if(usd>=50000)li.className='w';const t=new Date().toTimeString().slice(0,8);li.innerHTML=`<span>${t}</span><span class="${side}">${side.toUpperCase()}</span><span>${q.toFixed(2)} SOL</span><span>$${Math.round(usd).toLocaleString()}</span><span>${usd>=50000?'🐋 whale':''}</span>`;const ul=$('tp');ul.prepend(li);while(ul.children.length>8)ul.lastChild.remove()}
function tick(){const last=C[C.length-1];last.c*=1+(Math.random()-.493)*.0016;last.h=Math.max(last.h,last.c);last.l=Math.min(last.l,last.c);
if(Math.random()<.12){C.push({o:last.c,c:last.c,h:last.c,l:last.c});C.shift()}
const px=$('px'),was=parseFloat(px.textContent)||last.c;px.textContent=last.c.toFixed(2);px.style.color=last.c>=was?'#22c55e':'#f43f5e';
const ch=(last.c/open-1)*100;$('chg').textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';$('chg').style.background=ch>=0?'#22c55e22':'#f43f5e22';$('chg').style.color=ch>=0?'#22c55e':'#f43f5e';
$('vol').textContent='$'+(vol/1e6).toFixed(1)+'M';$('bs').textContent=buys+' / '+sells;draw()}
size();addEventListener('resize',()=>{size();draw()});tick();book();for(let i=0;i<6;i++)trade();
setInterval(tick,700);setInterval(book,1400);setInterval(trade,900);
</script></body></html>
